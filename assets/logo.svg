  -->
  <rect width="64" height="64" rx="14" fill="#9a4b1f" />
  <path
    d="M44 22a14 14 0 1 0 0 20"
    fill="none"
    stroke="#fff"
    stroke-width="6"
    stroke-linecap="round"
  />
</svg>
