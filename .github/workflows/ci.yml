name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    # The CLI is published for Windows, Linux and macOS, so it is verified on
    # all three rather than assumed portable: path handling, recursive directory
    # walking and console encoding are exactly where portability breaks.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # The same single command contributors run locally, so a green terminal
      # and a green pipeline cannot disagree about what was checked.
      - run: npm run verify

      # Redaction rewrites real containers, and the only convincing proof that
      # it did not corrupt one is a real implementation reopening the result.
      # The script skips rather than fails where LibreOffice cannot produce the
      # control document, so it never reds the run for an environment reason.
      - name: Round-trip real documents through LibreOffice
        if: runner.os == 'Linux'
        run: node scripts/real-files.mjs

  # [F-P2 2.8] The performance budget: for each format, a 50 MB file inspected
  # and cleaned, its time and peak memory held to perf-budget.json. One runner,
  # so the budgets measure the code rather than the machine; the table lands on
  # the run's summary page.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/perf.mjs

  # [F-P2 2.8] The single-file binary, built and run on each system it is
  # released for, so a release does not find out first.
  sea:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-sea.mjs

  # [F-P3 2.5] The image cirta serve runs in, built and tried as it would run:
  # read-only, no capability, the smoke test against its two ports.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -t cirta:ci .
      - run: docker run -d --name cirta --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:1344:1344 -p 127.0.0.1:8080:8080 cirta:ci
      - run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          node scripts/smoke-serve.mjs --http http://127.0.0.1:8080 --icap 127.0.0.1:1344
      - if: always()
        run: docker logs cirta

  # [F-P3 2.7] The accessibility audit of the built site: axe-core in Chromium,
  # both languages, every theme, a keyboard walk and a 320px screen. The two
  # packages are installed for this job only, at the versions the script names.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: node scripts/a11y.mjs

  # [F-P2 2.6] The editor and browser extensions, built and packaged; the
  # browser one also through Mozilla's linter, which fails on an error.
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-vscode.mjs --package
      - run: node scripts/build-browser-extension.mjs
      - run: npx --yes web-ext@8.3.0 lint --source-dir build/browser-extension

  # [F-P2 2.6] The repository's own GitHub Action, run on its pull requests as a
  # user's workflow would run it — limited to examples/, since the test sources
  # carry invisible characters on purpose.
  action:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          paths: examples
          fail-on: confirmed

