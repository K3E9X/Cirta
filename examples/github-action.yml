# [F-P2 2.6] Copy to .github/workflows/ciirta.yml: every pull request has the
# documents it changes inspected — metadata, hidden text, active content,
# invisible characters —, each finding annotated on the pull request, and the
# check fails while a confirmed one is left. Everything runs in the runner.
name: Ciirta

on:
  pull_request:

permissions:
  contents: read
  # Only for upload-sarif: true (code scanning).
  security-events: write

jobs:
  ciirta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history back to the base branch, to tell what the pull request changed.
          fetch-depth: 0
      - uses: K3E9X/Cirta@main
        with:
          fail-on: confirmed
          # paths: docs contrats
          # upload-sarif: 'true'
